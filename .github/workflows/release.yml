# La chaîne de publication de l'application, déclenchée par un tag `v*`.
#
#   git tag v0.3.0 && git push --tags
#
# Quatre étapes dans cet ordre : on vérifie, on construit, on publie, on relit
# sans identifiants. La dernière est la seule qui prouve que ce qui est en ligne
# est atteignable par quelqu'un d'autre que nous — le projet applique déjà cette
# règle à la publication du bucket, elle vaut pour les binaires.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag à publier (ex. v0.3.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  guard:
    name: vérifications préalables
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Un tag qui ne correspond pas à `package.json` produirait un installeur
      # nommé d'une version et publié sous une autre. La divergence ne se verrait
      # qu'après téléchargement.
      - id: version
        name: le tag correspond à la version du paquet
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Le tag $TAG ne correspond pas à la version $version de package.json."
            exit 1
          fi

      # Les notes existent dans les trois langues, sinon la page `/releases`
      # afficherait un trou dans une langue et pas dans les autres.
      - name: les notes existent dans les trois langues
        run: node site/release-notes.mjs "${{ steps.version.outputs.version }}" > /dev/null

      - name: la suite de l'application est verte
        run: |
          npm ci --prefix apps/desktop
          npm test --prefix apps/desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: la suite du site est verte
        run: node --test "test/**/*.test.js"
        working-directory: site

  build:
    name: ${{ matrix.os }}
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - run: npm ci
        working-directory: apps/desktop

      # La graine est téléchargée depuis le bucket, jamais copiée d'un `dist/`
      # local : l'installeur ne peut donc pas promettre un catalogue que le
      # bucket n'a pas. `fetch-seed` s'arrête sans rien écrire si la source est
      # injoignable — le build échoue franchement plutôt que d'embarquer une
      # graine périmée.
      - run: npm run seed
        working-directory: apps/desktop

      - name: empaqueter et téléverser
        run: npx --no-install electron-builder ${{ matrix.target }} --publish always
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: android (APK)
    # Attend `build` : `gh release upload` exige que la Release existe déjà,
    # et c'est le premier `electron-builder --publish always` qui la crée.
    needs: [guard, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3

      # `android/variables.gradle` (engendré, non versionné) réclame l'API 36 :
      # l'action pose les licences et les outils de base, pas forcément une
      # plateforme aussi récente.
      - name: installer la plateforme et les build-tools attendus
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - run: npm ci
        working-directory: apps/mobile

      - run: npm run seed
        working-directory: apps/mobile

      - run: node scripts/prepare-www.mjs --sans-sonde
        working-directory: apps/mobile

      # `android/` est engendré et ignoré par git (voir le README du module) :
      # sur un clone frais, il n'existe pas encore.
      - run: npx cap add android && npx cap sync android
        working-directory: apps/mobile

      # Sans cette étape, l'APK publié porte l'icône et l'écran de démarrage de
      # Capacitor. `android/` vient d'être engendré à la ligne au-dessus, avec
      # ses ressources par défaut ; c'est ce script qui y pose les nôtres,
      # depuis `resources/android/`, seul endroit que git suive. Rien
      # n'échouerait sans lui — c'est précisément pourquoi il est nommé ici et
      # pas laissé au hasard d'un `npm run sync` que la CI n'appelle pas.
      - run: node scripts/prepare-android.mjs
        working-directory: apps/mobile

      # La clé de débogage standard d'Android — celle qu'attend
      # `release-android.mjs` par défaut, documentée dans le README comme le
      # choix voulu : changer de signataire casserait la mise à jour des
      # appareils déjà installés avec cette clé.
      - name: générer la clé de débogage
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 10000 \
            -keyalg RSA -keysize 2048

      - run: node scripts/release-android.mjs
        working-directory: apps/mobile

      - name: téléverser l'APK
        run: |
          set -euo pipefail
          version="${{ needs.guard.outputs.version }}"
          apk="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          cp "$apk" "beyt-el-hikma-$version.apk"
          gh release upload "$TAG" "beyt-el-hikma-$version.apk" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: publier la Release
    needs: [guard, build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Le corps de la Release vient des CHANGELOG, jamais l'inverse : c'est ce
      # qui garantit que la page du site et la Release disent la même chose.
      - name: rédiger le corps depuis les CHANGELOG
        run: node site/release-notes.mjs "${{ needs.guard.outputs.version }}" > notes.md

      - name: sortir du brouillon
        run: gh release edit "$TAG" --notes-file notes.md --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: relecture anonyme
    needs: [guard, publish]
    runs-on: ubuntu-latest
    steps:
      # Sans identifiants, exprès. Une publication qui réussit derrière un jeton
      # et échoue sans lui est un échec qui ne se voit qu'en production.
      - name: le manifeste de mise à jour est lisible sans jeton
        if: ${{ !github.event.repository.private }}
        run: |
          set -euo pipefail
          base="https://github.com/${{ github.repository }}/releases/download/$TAG"
          curl -fsSL --retry 5 --retry-delay 5 -o latest.yml "$base/latest.yml"
          grep -q '^version:' latest.yml
          curl -fsSL --retry 5 --retry-delay 5 -o latest-linux.yml "$base/latest-linux.yml"

      - name: dépôt privé — relecture anonyme impossible
        if: ${{ github.event.repository.private }}
        run: |
          echo "::warning::Le dépôt est privé : les artefacts ne sont pas téléchargeables sans jeton."
          echo "::warning::Cette vérification ne prouvera rien tant que le dépôt ne sera pas public."

  site:
    name: publier le site
    needs: publish
    uses: ./.github/workflows/site.yml
    # Sans ce drapeau, le workflow appelé se croit déclenché par le push du tag
    # — dont le `head_commit` est le commit `chore(release):` — et sa propre
    # garde l'écarte. Voir la description de l'entrée.
    with:
      depuis_la_release: true
    permissions:
      contents: read
      pages: write
      id-token: write

  verify-site:
    name: relecture du site
    needs: [guard, site]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # La même règle que `verify` applique aux binaires, appliquée aux pages :
      # on relit ce qui est **en ligne**, pas ce que le build croit avoir écrit.
      # Un site qui reste sur la version précédente est une panne silencieuse —
      # le tag est public, la Release aussi, et la page dit encore autre chose.
      #
      # C'est `releases.json` qu'on interroge, et pas une page : c'est le contrat
      # de données dont les neuf pages sont rendues, et l'égalité y est exacte.
      # Chercher « 0.4.1 » dans du HTML passerait sur n'importe quelle autre
      # mention du même nombre.
      #
      # La boucle n'est pas une superstition : GitHub Pages sert par un CDN qui
      # rend brièvement la copie précédente après un déploiement. Sans elle, ce
      # test échouerait sur un site parfaitement à jour — c'est exactement la
      # méprise qui a fait relancer la publication à la main une fois.
      - name: le site en ligne annonce la version publiée
        run: |
          set -euo pipefail
          version="${{ needs.guard.outputs.version }}"
          url=$(node -e "import('./site/config.mjs').then((m) => console.log(m.absoluteUrl('releases.json')))")
          for attempt in $(seq 1 10); do
            online=$(curl -fsSL --retry 3 "$url" | node -e "
              let raw = '';
              process.stdin.on('data', (chunk) => { raw += chunk; });
              process.stdin.on('end', () => console.log(JSON.parse(raw).latest?.version ?? ''));
            ")
            if [ "$online" = "$version" ]; then
              echo "le site annonce $version"
              exit 0
            fi
            echo "::notice::tentative $attempt : le site annonce « ${online:-rien} », attendu $version."
            sleep 15
          done
          echo "::error::Le site en ligne n'annonce pas $version après 10 tentatives."
          exit 1
