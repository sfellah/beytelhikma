# La publication du site sur GitHub Pages.
#
# Séparée de `release.yml` exprès : une coquille dans une page ne doit pas
# réclamer une nouvelle version de l'application, et une nouvelle version doit
# rafraîchir le site sans qu'on y pense. D'où les deux déclencheurs — un push
# sur le site, et un appel depuis la chaîne de publication.
name: site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'CHANGELOG.*.md'
      - 'apps/desktop/src/renderer/styles/tokens.css'
      - 'apps/desktop/src/renderer/assets/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      depuis_la_release:
        description: >-
          Vrai quand la chaîne de publication nous appelle, après la Release.
          Un workflow appelé **hérite** du contexte de l'évènement déclencheur :
          il voit `event_name: push` et le `head_commit` du tag, c'est-à-dire
          le commit `chore(release):`. La garde ci-dessous, écrite pour écarter
          le push direct, écartait donc aussi l'appel — et `verify-site`, qui
          en dépend, était sauté avec lui. Rien ne rougissait, et le site
          restait sur la version d'avant, exactement la panne que la garde
          prétend éviter.
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Un commit de version ne publie pas le site : la chaîne de publication le
    # fera elle-même, après la Release, avec les données que celle-ci vient de
    # créer. Sans cette garde, les deux partent ensemble — `chore(release)`
    # touche les CHANGELOG, qui sont un chemin déclencheur d'ici — et le premier
    # arrivé déploie un site où la nouvelle version n'existe pas encore. Elle
    # est corrigée cinq minutes plus tard, mais entre-temps le tag est public et
    # la page annonce la version précédente.
    #
    # Et surtout : un run *en attente* dans le groupe `pages` est annulé par le
    # suivant qui s'y présente. Deux producteurs pour un même artefact, c'est un
    # troisième push qui peut faire disparaître la publication du site sans
    # qu'aucun voyant ne rougisse.
    #
    # Le message du commit, et non le tag : les deux `push` — la branche et le
    # tag — arrivent séparément, et rien ne garantit lequel le premier. Un tag
    # qu'on cherche peut n'être pas encore là. Une version publiée sous un autre
    # libellé ne fait que redéployer le site pour rien, ce qui est bénin.
    #
    # `inputs.depuis_la_release` d'abord : c'est le seul signal qui distingue
    # l'appel du push, les deux portant le même évènement.
    if: >-
      inputs.depuis_la_release ||
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Le générateur ne parle jamais au réseau : c'est ici qu'on lui pose les
      # données sur le disque. Un build déterministe se teste ; un build qui
      # interroge GitHub rend des pages différentes selon l'heure.
      - name: relever les versions publiées
        run: |
          set -euo pipefail
          mkdir -p site/data
          gh api "repos/${{ github.repository }}/releases" --paginate > site/data/releases.api.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Les empreintes SHA-512 vivent dans les manifestes d'electron-updater.
      # Une version qui n'en a pas reste téléchargeable : la page affiche le
      # lien sans l'empreinte, et le dit ici plutôt que de passer sous silence.
      - name: relever les empreintes
        run: |
          set -euo pipefail
          tags=$(node -e "
            const releases = require('./site/data/releases.api.json');
            for (const release of releases) if (!release.draft) console.log(release.tag_name);
          ")
          for tag in $tags; do
            mkdir -p "site/data/updater/$tag"
            if ! gh release download "$tag" --pattern 'latest*.yml' \
                 --dir "site/data/updater/$tag" --clobber 2>/dev/null; then
              echo "::notice::$tag ne porte aucun manifeste de mise à jour : pas d'empreinte affichée."
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Le nombre de livres annoncé vient du même fichier que celui qui dit ce
      # que l'installeur embarque : la page ne peut donc pas promettre un
      # corpus que l'application n'a pas.
      - name: relever le catalogue publié
        run: node scripts/fetch-seed.mjs
        working-directory: apps/desktop

      - name: rendre le site
        run: node build.mjs
        working-directory: site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
