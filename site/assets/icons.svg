<!--
  Le sprite d'icônes du site. Inséré tel quel dans chaque page par le gabarit :
  aucune requête, aucun CDN, aucune police d'icônes.

  Pas de logos de marque. Windows et Linux sont désignés par un portable et un
  terminal, jamais par leurs marques : les mots à côté portent déjà le sens, et
  un logo déposé dans un dépôt sous AGPL est une question de droits qu'on n'a
  aucune raison de se poser pour deux boutons.

  Tracé uniquement, 24×24, `currentColor` : la couleur vient du contexte, donc
  des jetons, donc du thème.
-->
