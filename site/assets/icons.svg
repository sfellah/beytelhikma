<!--
  Le sprite d'icônes du site. Inséré tel quel dans chaque page par le gabarit :
  aucune requête, aucun CDN, aucune police d'icônes.

  Pas de logos de marque. Les trois systèmes sont désignés par des **formes
  génériques** — une fenêtre à quatre carreaux, un manchot, un robot — et jamais
  par leurs marques : les mots à côté portent déjà le sens, et un logo déposé
  dans un dépôt sous AGPL est une question de droits qu'on n'a aucune raison de
  se poser pour trois cartes. Aucun de ces tracés n'est le redessin d'une marque
  au trait près : le carreau de Windows est encadré et jointif là où la marque
  est faite de quatre quadrilatères détachés et penchés ; le robot a des bras et
  des jambes, que le sien n'a pas.

  Un tracé vaut mieux qu'un mot seul : sur une page de téléchargement, on
  cherche son système du regard avant de lire.

  Tracé uniquement, 24×24, `currentColor` : la couleur vient du contexte, donc
  des jetons, donc du thème.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3v12M7 12l5 5 5-5M4 21h16" />
  </symbol>
  <symbol id="i-laptop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5" width="18" height="12" rx="2" /><path d="M1 20h22" />
  </symbol>
  <symbol id="i-terminal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="16" rx="2" /><path d="M7 9l3 3-3 3M13 15h4" />
  </symbol>
  <!-- Une fenêtre à quatre carreaux : un cadre et une croisée. -->
  <symbol id="i-windows" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="4.5" width="17" height="15" rx="1" /><path d="M12 4.5v15M3.5 12h17" />
  </symbol>
  <!-- Un manchot : corps arrondi, deux yeux, un bec, deux pattes. -->
  <symbol id="i-linux" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.8c-2.5 0-4 1.9-4 4.4v3.3c0 1.2-.6 2.1-1.3 3.1-.7 1-1.2 2-1.2 3.1 0 2.5 2.9 4.3 6.5 4.3s6.5-1.8 6.5-4.3c0-1.1-.5-2.1-1.2-3.1-.7-1-1.3-1.9-1.3-3.1V7.2c0-2.5-1.5-4.4-4-4.4z" />
    <path d="M10.4 7.2h.01M13.6 7.2h.01" />
    <path d="M10.9 9.4 12 10.5l1.1-1.1" />
    <path d="M9.6 20.4 8.4 22M14.4 20.4 15.6 22" />
  </symbol>
  <!-- Un robot : dôme et antennes, tronc, bras, jambes. -->
  <symbol id="i-android" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7.5 9a4.5 4.5 0 0 1 9 0" />
    <path d="M6 5.4 7.9 7.9M18 5.4 16.1 7.9" />
    <path d="M10.2 6.9h.01M13.8 6.9h.01" />
    <path d="M7.5 9h9v6.5a2 2 0 0 1-2 2h-5a2 2 0 0 1-2-2z" />
    <path d="M4.6 10.8v3.8M19.4 10.8v3.8" />
    <path d="M10.2 17.5V21M13.8 17.5V21" />
  </symbol>
  <symbol id="i-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 4h11a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2z" /><path d="M18 20a2 2 0 0 0-2-2H5" />
  </symbol>
  <symbol id="i-offline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 2l20 20M5 12.5a11 11 0 0 1 5-2.6M8.5 16a6 6 0 0 1 3-1.6M12 20h.01M19 12.5a11 11 0 0 0-4-2.4" />
  </symbol>
  <symbol id="i-layers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5" />
  </symbol>
  <symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3c2.5 3 2.5 15 0 18M12 3c-2.5 3-2.5 15 0 18" />
  </symbol>
  <symbol id="i-code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
